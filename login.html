<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><title>Sign in — DevCheck</title></head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="home.html" class="logo"><span class="logo-mark">D</span><span>DevCheck</span></a>
    <h1 style="margin-top:24px">Welcome back, hunter</h1>
    <p class="sub">Sign in to file bugs, post projects, and earn points.</p>
    <div id="msg"></div>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input class="input" type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input class="input" type="password" id="password" required autocomplete="current-password" minlength="6" />
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" id="submit-btn">Sign In</button>
    </form>
    <div class="auth-divider">OR</div>
    <button class="btn btn-ghost btn-block" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.3 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3C41.3 35.4 44 30.1 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <p class="auth-switch">New to DevCheck? <a href="signup.html">Create an account</a></p>
  </div>
</div>
<script type="module" src="js/auth.js"></script>
</body></html>
